name = "content-share"
main = "src/worker.ts"
compatibility_date = "2026-08-16"

routes = [
  { pattern = "content.aryuki.com", custom_domain = true }
]

[triggers]
crons = ["*/10 * * * *"]

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

[[d1_databases]]
binding = "DB"
database_name = "content-share-db"
database_id = "f9533d8c-9bf4-42a0-a213-32df014367d4"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "content-share-save"

[[queues.producers]]
binding = "UPLOAD_QUEUE"
queue = "content-share-upload-queue"

[[queues.consumers]]
queue = "content-share-upload-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "content-share-upload-dlq"

[vars]
SSO_URL = "https://accounts.aryuki.com"
SSO_APP_ID = "content-share"
PUBLIC_BASE_URL = "https://content.aryuki.com"
ADMIN_CONTACT_EMAIL = "admin-contact@haoyur.com"
R2_ACCOUNT_ID = "3903d3554a2e7453ce23f44bc989fe6b"
R2_BUCKET_NAME = "content-share-save"
